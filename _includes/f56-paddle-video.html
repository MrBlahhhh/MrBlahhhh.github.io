<style>
  .f56-paddle-video { margin: 1rem 0; }
  .f56-paddle-video video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #101820; border-radius: 12px; }
  .f56-paddle-video .video-jumps { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .75rem; }
  .f56-paddle-video .video-jumps[hidden] { display: none; }
  .f56-paddle-video button { font: inherit; color: inherit; background: transparent; border: 1px solid currentColor; border-radius: 6px; padding: .55rem .85rem; cursor: pointer; min-height: 44px; }
  .f56-paddle-video button:focus-visible { outline: 2px solid #ffab77; outline-offset: 3px; }
  .f56-paddle-video .video-status { margin: .5rem 0 0; font-size: .9rem; }
</style>
<div class="f56-paddle-video" id="f56-paddle-video">
  <video controls playsinline preload="metadata" width="1280" height="720" poster="{{ '/assets/images/f56-push-pull-paddle/hero.jpg' | relative_url }}" aria-label="F56 paddle CAD assembly, then pull and push with illustrative click sounds">
    <source src="{{ '/assets/images/f56-push-pull-paddle/assembly-and-clicks.mp4' | relative_url }}" type="video/mp4">
    <track kind="captions" src="{{ '/assets/images/f56-push-pull-paddle/assembly-and-clicks.vtt' | relative_url }}" srclang="en" label="English">
    <a href="{{ '/assets/images/f56-push-pull-paddle/assembly-and-clicks.mp4' | relative_url }}">Watch or download the assembly animation.</a>
  </video>
  <div class="video-jumps" hidden>
    <button type="button" data-start="0">Play assembly</button>
    <button type="button" data-start="14">See it click</button>
  </div>
  <p class="video-status" aria-live="polite">Play with sound to hear the illustrative clicks.</p>
</div>
<script>
(() => {
  const root = document.getElementById('f56-paddle-video');
  const video = root.querySelector('video');
  const status = root.querySelector('.video-status');
  root.querySelector('.video-jumps').hidden = false;
  root.querySelectorAll('[data-start]').forEach(button => {
    button.addEventListener('click', async () => {
      try {
        if (video.readyState === 0) {
          await new Promise((resolve, reject) => {
            video.addEventListener('loadedmetadata', resolve, {once: true});
            video.addEventListener('error', reject, {once: true});
            video.load();
          });
        }
        video.currentTime = Number(button.dataset.start);
        await video.play();
        status.textContent = button.dataset.start === '0' ? 'Playing the assembly, followed by pull and push.' : 'Playing the transparent view: each magnet letting go and both switch clicks.';
      } catch {
        status.textContent = 'Use the video Play control to start the animation.';
      }
    });
  });
})();
</script>
