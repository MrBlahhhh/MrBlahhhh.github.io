<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F56 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <body data-level="car">
    <div id="stage"></div>

    <header id="hud">
      <div class="title">
        <a class="post-link" id="post-link" hidden>‹ Back to the post</a>
        <div class="kicker" id="car-kicker">MINI F56 · Cooper S</div>
        <div id="crumb">MINI F56</div>
      </div>
      <nav class="levels">
        <button class="hud-btn" id="back" title="Up one level (Esc)">‹ Back</button>
        <button class="hud-btn" data-goto="">Car</button>
        <!-- one button per section goes here (main.ts) -->
        <button class="hud-btn in-section" id="toggle-explode">Assemble</button>
        <span class="sep in-section"></span>
        <button class="hud-btn in-section" id="open-wiring-hud">Wiring</button>
      </nav>
    </header>

    <div id="hint">Loading…</div>
    <aside id="card" hidden></aside>

    <div id="lightbox" class="overlay" hidden></div>
    <div id="wiring" class="overlay panel" hidden></div>
    <div id="procedures" class="overlay panel" hidden></div>
    <div id="walk" class="overlay" hidden></div>


  </body>
